# Self-host reverse proxy (ADR 0005 §3). Web and API are served under the
# same origin — this is what makes the app's SameSite=Lax, no-explicit-domain
# session cookie (apps/web/src/lib/auth/cookie-options.ts) work at all: a
# browser refuses to send it back to a different origin.
#
#   /       -> web   (Next.js, port 3000)
#   /api/   -> api   (NestJS, port 3000, global prefix "api")
#
# TLS termination is deliberately NOT configured here — see the commented
# block and docs/delivery/self-host.md for why a proxy in front of this one
# (e.g. Caddy, Traefik, a managed load balancer) is the recommended way to
# add HTTPS, rather than teaching this config to manage certificates itself.

# Falls back to nginx's own per-request $request_id when the client didn't
# send one, so every request gets exactly one id that's stable across the
# whole proxy chain — never two different generated ids for the same
# request, and never a client-supplied id silently dropped.
map $http_x_request_id $plinto_request_id {
    default   $http_x_request_id;
    ""        $request_id;
}

server {
    listen 80;
    server_name _;

    # Generous enough for the app's own uploads (CSV imports, etc.) without
    # being unbounded; tune per-deployment if that assumption changes.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:3000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $plinto_request_id;
    }

    location / {
        proxy_pass http://web:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $plinto_request_id;

        # Harmless in this deployment (Next.js production `next start` /
        # standalone server doesn't need a WebSocket upgrade the way `next
        # dev`'s HMR does), kept so this config also works unmodified in
        # front of a dev server.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- TLS (recommended: terminate in front of this proxy instead) ----------
#
# The default path above is plain HTTP behind whatever already terminates
# TLS for you (a managed load balancer, Caddy, Traefik, a PaaS's edge). If
# you genuinely have nothing in front of this nginx and need it to terminate
# TLS itself, obtain a certificate (e.g. via certbot) and adapt:
#
# server {
#     listen 443 ssl;
#     server_name your-domain.example;
#
#     ssl_certificate     /etc/letsencrypt/live/your-domain.example/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.example/privkey.pem;
#
#     client_max_body_size 20m;
#
#     location /api/ { proxy_pass http://api:3000/api/; ... same proxy_set_header lines as above ... }
#     location /     { proxy_pass http://web:3000;       ... same proxy_set_header lines as above ... }
# }
#
# server {
#     listen 80;
#     server_name your-domain.example;
#     return 301 https://$host$request_uri;
# }
#
# Remember to also set COOKIE_SECURE=true and use an https:// PLINTO_PUBLIC_URL
# once TLS is in place — see deploy/self-host.env.example.
